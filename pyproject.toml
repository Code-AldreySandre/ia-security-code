[project]
name = "ia-security-code"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "openai (>=3.57.0,<4.0.0)",
    "google-genai (>=3.6.1,<4.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[tool.poetry]
packages = [{include = "ia_security_code", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]
